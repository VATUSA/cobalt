name: CI to Staging
on:
  push:
    branches: [main]
jobs:
  common-build:
    uses: vatusa/gitops/.github/workflows/common-build.yml@main
    with:
      image-name: 'cobalt'
    secrets: inherit
  migrations-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration versions are unique
        run: ./scripts/check-migrations.sh
  common-dev-ci:
    uses: vatusa/gitops/.github/workflows/common-dev-ci.yml@main
    needs: [common-build, migrations-check]
    with:
      image-name: 'cobalt'
      kustomization-folder: 'cobalt'
    secrets: inherit

