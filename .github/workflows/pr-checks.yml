name: PR Checks
on:
  pull_request:
jobs:
  migrations-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check migrations are unique, complete, and ordered against base
        run: ./scripts/check-migrations.sh --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'src/go.mod'
      - name: Run tests
        working-directory: src
        run: go test ./...