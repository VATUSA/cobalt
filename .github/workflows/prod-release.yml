name: Production Release
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to checkout (optional)'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Build Docker Image
        run: docker build . --file Dockerfile --tag vatusa/cobalt --target app

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub (main)
        run: |
          docker tag vatusa/cobalt vatusa/cobalt:latest
          docker tag vatusa/cobalt vatusa/cobalt:${{ github.sha }}
          docker push vatusa/cobalt:latest
          docker push vatusa/cobalt:${{ github.sha }}
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.inputs.commit_sha || github.sha }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          repository: 'VATUSA/gitops'
          path: gitops
          token: ${{ secrets.G_TOKEN }}
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Update manifests (prod)
        run: |
          cd $GITHUB_WORKSPACE/gitops/cobalt/overlays/prod
          kustomize edit set image vatusa/cobalt=vatusa/cobalt:${{ env.SHA }}
      - name: Commit and push changes
        run: |
          cd $GITHUB_WORKSPACE/gitops
          git config --global user.email "vatusa6@vatusa.net"
          git config --global user.name "VATUSA6"
          git add .
          git commit -m "Update cobalt image tag to ${{ env.SHA }}"
      - name: Push to gitops repo
        run: |
          cd $GITHUB_WORKSPACE/gitops
          git push origin main
      
